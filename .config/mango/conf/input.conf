# INPUT  (equivalente a input.lua)

# Teclado: us + es, ALT+SHIFT cambia (xkb nativo; la barra lo detecta sola)
xkb_rules_layout=us,es
xkb_rules_options=grp:alt_shift_toggle
repeat_rate=25
repeat_delay=600
numlockon=0

# Foco: sigue al mouse (follow_mouse = 1)
sloppyfocus=1
warpcursor=1

# Touchpad / mouse (requiere relogin)
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
mouse_natural_scrolling=0

# Reglas por dispositivo (hl.device "epic-mouse-v1" sensitivity -0.5)
devicerule=name:epic-mouse-v1,accel_speed:-0.5
