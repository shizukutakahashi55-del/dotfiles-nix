# RULES  (equivalente a windowrules.lua)
# Layout por defecto de los tags: autogen/layout.conf (OozeShell). Respaldo:
tagrule=id:*,layout_name:scroller

# ---- Layer rules ----
# Quickshell sin animacion de capa de Mango
layerrule=noanim:1,layer_name:^oozeshell
# Rofi: zoom
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# ---- Steam ----
# Ventanas secundarias flotantes (amigos, ajustes); la principal en mosaico.
# La regla especifica va despues para que gane.
windowrule=isfloating:1,isnoanimation:1,noblur:1,isnoborder:1,appid:^steam$
windowrule=isfloating:0,appid:^steam$,title:^Steam$

# ---- Juegos ----
# Touhou Fuujinroku
windowrule=isfloating:1,isnoanimation:1,noblur:1,isnoborder:1,appid:^th10tr\.exe$

# ---- Terminales ----
windowrule=isnoborder:1,appid:^com\.mitchellh\.ghostty$

# windowrule=focused_opacity:0.75,unfocused_opacity:0.60,appid:^kitty$
# ---- Maximize ----
# `ignore_maximize` ya viene en 1 por defecto (equivale a suppress_event maximize)
