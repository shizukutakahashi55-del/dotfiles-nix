# RULES  (equivalente a windowrules.lua)
# Layout por defecto de los tags: autogen/layout.conf (OozeShell). Respaldo:
tag_rule=id:*,layout_name:scroller

# ---- Layer rules ----
# Quickshell sin animacion de capa de Mango
layer_rule=no_animation:1,layer_name:oozeshell-
layer_rule=no_animation:1,layer_name:quickshell-
layer_rule=no_animation:1,layer_name:oozewalls
layer_rule=no_animation:1,layer_name:mpvpaper

# Rofi: zoom
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# ---- Steam ----
# Ventanas secundarias flotantes (amigos, ajustes); la principal en mosaico.
# La regla especifica va despues para que gane.
window_rule=is_floating:1,no_animation:1,no_blur:1,no_border:1,app_id:^steam$
window_rule=is_floating:0,no_animation:0,app_id:^steam$,title:^Steam$

# ---- Juegos ----
# Touhou Fuujinroku
window_rule=is_floating:1,no_animation:1,no_blur:1,no_border:1,app_id:^th10tr\.exe$

# ---- Terminales ----
window_rule=no_border:1,app_id:^com\.mitchellh\.ghostty$

# -----Overwatch -------------------------------
window_rule=is_floating:0,is_fullscreen:1,app_id:steam_app_2357570

window_rule=no_border:1,is_floating:1,width:980,height:640,app_id:org.quickshell
# windowrule=focused_opacity:0.75,unfocused_opacity:0.60,appid:^kitty$
# ---- Maximize ----
# `ignore_maximize` ya viene en 1 por defecto (equivale a suppress_event maximize)
