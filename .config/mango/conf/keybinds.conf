# KEYBINDS  (equivalente a keybinds.lua)  mainMod = SUPER
# Tags (1-9) == workspaces de Hyprland. Mango no tiene tag 10.

# ---- Shell: atajo reutilizable ----
# QS = quickshell ipc -p ~/.config/quickshell/OozeShell-mango/shell.qml call

# Recargar la config de Mango
keymode=common
bind=SUPER+ALT,r,reload_config

# ---------------- APPLICATIONS ----------------
bind=SUPER,return,spawn,foot
bind=SUPER,e,spawn,dolphin
# Launcher de OozeShell
bind=SUPER,r,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- launcher toggle
# Rofi (Por si acaso)
bind=SUPER+SHIFT,d,spawn,rofi -show drun


# ---------------- WINDOW MANAGEMENT ----------------
bind=SUPER,c,killclient
bind=SUPER,v,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER,j,dwindle_toggle_split_direction

# "Coding workspace" (Toggle Gaps)
bind=SUPER,q,togglegaps
 
# Scroller: ancho de columna
bind=SUPER,bracketright,switch_proportion_preset
bind=SUPER,bracketleft,set_proportion,1.0
bind=SUPER,period,exchange_stack_client,next
bind=SUPER,comma,exchange_stack_client,prev

# ---------------- FOCUS ----------------
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,space,focuslast
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

# ---------------- MOVE WINDOW ----------------
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# ---------------- TAGS (workspaces) ----------------
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Rueda del mouse con SUPER: tag anterior / siguiente
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
# Gesto de 3 dedos horizontal: cambia de tag
gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,right,3,viewtoleft_have_client

# ---------------- SCRATCHPAD / MINIMIZE ----------------
bind=SUPER,s,toggle_special_tag
bind=SUPER+SHIFT,s,tag_special_tag
bind=SUPER,x,minimized
bind=SUPER+SHIFT,x,restore_minimized

# ---------------- MOUSE ----------------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ---------------- LAYOUTS ----------------
circle_layout=scroller,grid,tile,vertical_scroller,dwindle

bind=SUPER,k,switch_layout

# ---------------- LAYOUT DIRECTO ----------------
bind=SUPER+CTRL,1,setlayout,scroller
bind=SUPER+CTRL,2,setlayout,grid
bind=SUPER+CTRL,3,setlayout,tile
bind=SUPER+CTRL,4,setlayout,vertical_scroller
bind=SUPER+CTRL,5,setlayout,dwindle

# ---------------- TAG ANTERIOR / SIGUIENTE ----------------
bind=SUPER+CTRL,Left,viewtoleft_have_client
bind=SUPER+CTRL,Right,viewtoright_have_client

# ---------------- OOZESHELL ----------------
# Wallpaper selector
bind=SUPER,w,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call toggleWalls handle
# Monitor selector (elige en que monitor sale el shell)
bind=SUPER,l,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- monitor togglePicker
# Reiniciar Quickshell
bind=SUPER+SHIFT,p,spawn_shell,bash -c ~/.config/mango/restart.sh
  # Cheatsheet de keybinds
bind=SUPER,i,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call keybinds toggle
# Idioma (shell)
bind=SUPER,g,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- lang togglePicker
# Apariencia
bind=SUPER,h,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- appearance toggle
# Notificaciones
bind=SUPER,n,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- notify toggle
# Menu de energia
bind=SUPER+SHIFT,m,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- powermenu toggle
# Overview del shell
bind=SUPER,o,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- overview toggle
# Menu
bind=SUPER,m,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- menu toggle
# Ajustes
bind=SUPER+SHIFT,l,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- settings toggle
# Bloqueo
bind=SUPER+SHIFT,q,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call lock lock
# Nix search
bind=SUPER,u,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- nixsearch toggle
# Clipboard Toggle 
bind=SUPER,t,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call -- clipboard toggle


# Filtro de luz calida (hyprsunset -> wlsunset/gammastep)
bind=SUPER,y,spawn,~/.config/mango/scripts/sunset-toggle.sh

# ---------------- SCREENSHOTS ----------------
bind=NONE,Print,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell-mango/shell.qml call -- screenshot fullSave
bind=SUPER,Print,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell-mango/shell.qml call -- screenshot areaCopy
bind=SUPER+SHIFT,Print,spawn_shell,quickshell ipc -p ~/.config/quickshell/OozeShell-mango/shell.qml call -- screenshot areaSave

# ---------------------------------------------
# ---------------- SYSTEM BINDS ---------------
# ---------------------------------------------

# ---------------- MULTIMEDIA (funcionan con pantalla bloqueada) ----------------
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

bindl=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl -e4 -n2 set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl -e4 -n2 set 5%-

bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause

