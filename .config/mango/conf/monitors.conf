# MONITORS  (equivalente a monitors.lua)
# Nombres con `wlr-randr`. Ojo: con XWayland NO uses coordenadas negativas.
#
# Tags: en Mango cada monitor tiene sus propios tags 1-9 (no hace falta la
# regla "workspaces 1-5 en HDMI / 6-10 en DP-3" de Hyprland).

monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:74.97,x:10,y:260,scale:1
# DP-3: modo preferido, posicion automatica
monitorrule=name:^DP-3$,scale:1
