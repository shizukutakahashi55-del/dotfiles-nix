# APPEARANCE  (equivalente a appearance.lua + layouts.lua)
# Los valores de gaps/borde/blur/sombra los pisa OozeShell desde
# autogen/theme.conf (panel Apariencia). Estos son los de arranque.

# ---- Gaps y bordes ----
gap_inner_horizontal=3
gap_inner_vertical=3
gap_outer_horizontal=6
gap_outer_vertical=6
border_px=0
border_radius=6
no_radius_when_single=0
no_border_when_single=0
smart_gaps=0

# ---- Opacidad ----
focused_opacity=1.0
unfocused_opacity=1.0

# ---- Efectos ----
blur=1
blur_layer=5
#Disable Blur Optimized if you have errors
#keep on mind this increases GPU consumption
blur_optimized=1
blur_params_num_passes=5
blur_params_radius=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2
shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ee

# ---- Colores (paleta de colors.lua: primary / tertiary / outline) ----
root_color=0x131313ff
border_color=0x474747ff
focus_color=0xffb3afff
urgent_color=0xffb4abff
maximized_screen_color=0xe3c28cff
scratchpad_color=0xe7bdbaff
global_color=0xe3c28cff
overlay_color=0xffb3afff

# ---- Layouts (equivalente a layouts.lua) ----
# Layout por defecto de los 9 tags: ver autogen/layout.conf y rules.conf
# scrolling (hypr) -> scroller | dwindle -> dwindle | master -> tile | monocle -> monocle
scroller_structs=20
scroller_default_proportion=0.5
scroller_default_proportion_single=1.0
scroller_ignore_proportion_single=0
scroller_proportion_preset=0.5,0.8,1.0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
new_is_master=1
default_master_factor=0.55
default_master_count=1
dwindle_preserve_split=1
dwindle_smart_split=0

tag_num=9
