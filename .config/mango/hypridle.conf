# hypridle funciona en Mango (usa ext-idle-notify). El DPMS de Hyprland
# (hyprctl dispatch dpms) se cambia por scripts/dpms.sh (mmsg sleep/wakeup_monitor).
general {
    lock_cmd = quickshell ipc -p ~/.config/quickshell/OozeShell-mango/shell.qml call -- lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/mango/scripts/dpms.sh on
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = ~/.config/mango/scripts/dpms.sh off
    on-resume = ~/.config/mango/scripts/dpms.sh on
}

