# ============================================================================
#  MANGO MAIN FILE  (equivalente a hyprland.lua)
#  Solo hace source de los modulos de conf/, en orden de carga.
#  Docs: https://mangowm.github.io  (wiki: github.com/mangowm/mango/wiki)
# ============================================================================

# SYSTEM
source=./conf/env.conf

# APPEARANCE
source=./conf/appearance.conf
source=./conf/animations.conf
# Lo regenera OozeShell (panel Apariencia): pisa los valores de arriba
source_optional=./autogen/theme.conf
source_optional=./autogen/animprofile.conf

# INPUT
source=./conf/input.conf
source=./conf/keybinds.conf

# RULES (+ layout por defecto de los tags, regenerado por OozeShell)
source=./conf/rules.conf
source_optional=./autogen/layout.conf

# HARDWARE
source=./conf/monitors.conf

# STARTUP
exec_once=~/.config/mango/autostart.sh
