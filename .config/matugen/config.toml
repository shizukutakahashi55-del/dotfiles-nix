# ─────────────────────────────────────────────
# Settings Matugen 
# ─────────────────────────────────────────────

[config]
mode = "dark"
version_check = false
caching = false
show_color_picker = false


# ─────────────────────────────────────────────
# Starship
# ─────────────────────────────────────────────

[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/starship.toml"
post_hook = "pkill -USR1 -x zsh || true"

# ─────────────────────────────────────────────
# Foot
# ─────────────────────────────────────────────

[templates.foot]
input_path = "~/.config/matugen/templates/foot.ini.toml"
output_path = "~/.config/matugen/generated/foot-colors.ini"
post_hook = '''
  ln -nfs \
    "$HOME/.config/matugen/generated/foot-colors.ini" \
    "$HOME/.config/foot/foot-colors.ini"

  touch "$HOME/.config/foot/foot.ini" || true

  pkill -SIGUSR1 foot || true
'''


# ─────────────────────────────────────────────
# WezTerm
# ─────────────────────────────────────────────

[templates.wezterm]
input_path = "~/.config/matugen/templates/wezterm.lua"
output_path = "~/.config/wezterm/colors/OozeSoft.toml"
post_hook = "touch ~/.config/wezterm/wezterm.lua"


# ─────────────────────────────────────────────
# Hyprland
# ─────────────────────────────────────────────

[templates.hyprland]
input_path = "~/.config/matugen/templates/colors.lua"
output_path = "~/.config/hypr/modules/appearance/colors.lua"
post_hook = "hyprctl reload"


# ─────────────────────────────────────────────
# Cava
# ─────────────────────────────────────────────

[templates.cava]
input_path = "~/.config/matugen/templates/cava.ini"
output_path = "~/.config/cava/themes/matugen"
post_hook = "pkill -USR2 -x cava || true"


# ─────────────────────────────────────────────
# Yazi
# ─────────────────────────────────────────────

[templates.yazi]
input_path = "~/.config/matugen/templates/theme.toml"
output_path = "~/.config/yazi/theme.toml"


# ─────────────────────────────────────────────
# Vesktop
# ─────────────────────────────────────────────

[templates.vesktop]
input_path = "~/.config/matugen/templates/vesktop.css"
output_path = "~/.config/vesktop/themes/vesktop.css"


# ─────────────────────────────────────────────
# Hyprlock
# ─────────────────────────────────────────────

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/colors.conf"


# ─────────────────────────────────────────────
# Neovim
# ─────────────────────────────────────────────

[templates.neovim]
input_path = "~/.config/matugen/templates/nvim-colors.json"
output_path = "~/.cache/matugen/nvim-colors.json"
# post_hook = "pkill -SIGUSR1 nvim"


# ─────────────────────────────────────────────
# VS Code
# ─────────────────────────────────────────────

[templates.vscode-raw]
input_path = "~/.config/matugen/templates/vscode-colors"
output_path = "~/.cache/matugen/vscode-colors"

[templates.vscode-json]
input_path = "~/.config/matugen/templates/vscode-colors.json"
output_path = "~/.cache/matugen/vscode-colors.json"

# ─────────────────────────────────────────────
# Ghostty
# ─────────────────────────────────────────────
[templates.ghostty]
input_path = "~/.config/matugen/templates/ghostty"
output_path = "~/.config/ghostty/themes/OozeSoft"
# post_hook = "pkill -SIGUSR2 ghostty"

# ─────────────────────────────────────────────
# Qt6 / qt6ct
# ─────────────────────────────────────────────

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct.conf"
output_path = "~/.config/qt6ct/colors/OozeSoft.conf"

# ─────────────────────────────────────────────
# KDE / Dolphin
# ─────────────────────────────────────────────

[templates.kde]
input_path = "~/.config/matugen/templates/OozeSoft.colors"
output_path = "~/.local/share/color-schemes/OozeSoft.colors"

