# Auto-generado por Matugen — Plantilla para Yazi

[manager]
cwd = { fg = "{{ colors.primary.dark.hex }}" }

# Selección y elementos sobrevolados
hovered         = { fg = "{{ colors.on_primary_container.dark.hex }}", bg = "{{ colors.primary_container.dark.hex }}" }
preview_hovered = { bg = "{{ colors.surface_container.dark.hex }}" }

# Búsqueda / Find
find_keyword  = { fg = "{{ colors.on_tertiary_container.dark.hex }}", bg = "{{ colors.tertiary_container.dark.hex }}", bold = true }
find_position = { fg = "{{ colors.tertiary.dark.hex }}", bg = "reset", bold = true }

# Marcadores de archivos
marker_copied   = { fg = "{{ colors.secondary.dark.hex }}", bg = "{{ colors.secondary_container.dark.hex }}" }
marker_cut      = { fg = "{{ colors.error.dark.hex }}", bg = "{{ colors.error.dark.hex }}" }
marker_marked   = { fg = "{{ colors.primary.dark.hex }}", bg = "{{ colors.primary_container.dark.hex }}" }
marker_selected = { fg = "{{ colors.tertiary.dark.hex }}", bg = "{{ colors.tertiary_container.dark.hex }}" }

# Pestañas
tab_active   = { fg = "{{ colors.on_primary_container.dark.hex }}", bg = "{{ colors.primary_container.dark.hex }}", bold = true }
tab_inactive = { fg = "{{ colors.on_surface_variant.dark.hex }}", bg = "{{ colors.surface_container.dark.hex }}" }

# Bordes (Corregido)
border_symbol = "│"
border_style  = { fg = "{{ colors.outline_variant.dark.hex }}" }

[mode]
normal_main = { fg = "{{ colors.background.dark.hex }}", bg = "{{ colors.primary.dark.hex }}", bold = true }
normal_alt  = { fg = "{{ colors.primary.dark.hex }}", bg = "{{ colors.surface_container.dark.hex }}" }

select_main = { fg = "{{ colors.background.dark.hex }}", bg = "{{ colors.secondary.dark.hex }}", bold = true }
select_alt  = { fg = "{{ colors.secondary.dark.hex }}", bg = "{{ colors.surface_container.dark.hex }}" }

unset_main  = { fg = "{{ colors.background.dark.hex }}", bg = "{{ colors.error.dark.hex }}", bold = true }
unset_alt   = { fg = "{{ colors.error.dark.hex }}", bg = "{{ colors.surface_container.dark.hex }}" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "{{ colors.surface_container.dark.hex }}", bg = "{{ colors.surface_container.dark.hex }}" }

# Barra de progreso
progress_label  = { fg = "{{ colors.on_background.dark.hex }}", bold = true }
progress_normal = { fg = "{{ colors.primary.dark.hex }}", bg = "{{ colors.surface_container_lowest.dark.hex }}" }
progress_error  = { fg = "{{ colors.error.dark.hex }}", bg = "{{ colors.surface_container_lowest.dark.hex }}" }

# Permisos
perm_sep  = { fg = "{{ colors.outline_variant.dark.hex }}" }
perm_type = { fg = "{{ colors.primary.dark.hex }}" }
perm_read = { fg = "{{ colors.secondary.dark.hex }}" }
perm_write= { fg = "{{ colors.error.dark.hex }}" }
perm_exec = { fg = "{{ colors.tertiary.dark.hex }}" }

[select]
border   = { fg = "{{ colors.primary.dark.hex }}" }
active   = { fg = "{{ colors.on_primary_container.dark.hex }}", bg = "{{ colors.primary_container.dark.hex }}" }
inactive = { fg = "{{ colors.on_background.dark.hex }}" }

[input]
border   = { fg = "{{ colors.primary.dark.hex }}" }
title    = { fg = "{{ colors.primary.dark.hex }}" }
value    = { fg = "{{ colors.on_background.dark.hex }}" }
selected = { bg = "{{ colors.primary_container.dark.hex }}" }

[completion]
border   = { fg = "{{ colors.primary.dark.hex }}" }
active   = { fg = "{{ colors.on_primary_container.dark.hex }}", bg = "{{ colors.primary_container.dark.hex }}" }
inactive = { fg = "{{ colors.on_background.dark.hex }}" }

[tasks]
border  = { fg = "{{ colors.primary.dark.hex }}" }
title   = { fg = "{{ colors.primary.dark.hex }}" }
hover   = { fg = "{{ colors.on_primary_container.dark.hex }}", bg = "{{ colors.primary_container.dark.hex }}" }

[which]
mask            = { bg = "{{ colors.surface_container_lowest.dark.hex }}" }
cand            = { fg = "{{ colors.primary.dark.hex }}" }
rest            = { fg = "{{ colors.on_surface_variant.dark.hex }}" }
desc            = { fg = "{{ colors.secondary.dark.hex }}" }
separator       = "  "
separator_style = { fg = "{{ colors.outline_variant.dark.hex }}" }

[help]
on      = { fg = "{{ colors.primary.dark.hex }}" }
exec    = { fg = "{{ colors.secondary.dark.hex }}" }
desc    = { fg = "{{ colors.on_background.dark.hex }}" }
hover   = { fg = "{{ colors.on_primary_container.dark.hex }}", bg = "{{ colors.primary_container.dark.hex }}" }
footer  = { fg = "{{ colors.on_surface_variant.dark.hex }}", bg = "{{ colors.surface_container.dark.hex }}" }

[filetype]
rules = [
	{ url = "*/", fg = "{{ colors.primary.dark.hex }}", bold = true },
	{ mime = "image/*", fg = "{{ colors.tertiary.dark.hex }}" },
	{ mime = "video/*", fg = "{{ colors.secondary.dark.hex }}" },
	{ mime = "audio/*", fg = "{{ colors.secondary.dark.hex }}" },
	{ mime = "application/x-tar", fg = "{{ colors.error.dark.hex }}" },
	{ mime = "application/x-bzip*", fg = "{{ colors.error.dark.hex }}" },
	{ mime = "application/x-7z-compressed", fg = "{{ colors.error.dark.hex }}" },
	{ mime = "application/zip", fg = "{{ colors.error.dark.hex }}" },
	{ mime = "application/x-rar", fg = "{{ colors.error.dark.hex }}" },
	{ url = "*", is = "exec", fg = "{{ colors.secondary.dark.hex }}" },
	{ url = "*", is = "link", fg = "{{ colors.tertiary.dark.hex }}" },
	{ url = "*", is = "orphan", fg = "{{ colors.error.dark.hex }}" },
	{ mime = "*", fg = "{{ colors.on_background.dark.hex }}" }
]