# Auto-generado por Matugen — Plantilla para Yazi

[manager]
cwd = { fg = "#bcc8cf" }

# Selección y elementos sobrevolados
hovered         = { fg = "#98a4ab", bg = "#0c181d" }
preview_hovered = { bg = "#1f2020" }

# Búsqueda / Find
find_keyword  = { fg = "#b89d92", bg = "#22130c", bold = true }
find_position = { fg = "#ddc1b5", bg = "reset", bold = true }

# Marcadores de archivos
marker_copied   = { fg = "#c3c7ca", bg = "#454a4c" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#bcc8cf", bg = "#0c181d" }
marker_selected = { fg = "#ddc1b5", bg = "#22130c" }

# Pestañas
tab_active   = { fg = "#98a4ab", bg = "#0c181d", bold = true }
tab_inactive = { fg = "#c3c7ca", bg = "#1f2020" }

# Bordes (Corregido)
border_symbol = "│"
border_style  = { fg = "#43474a" }

[mode]
normal_main = { fg = "#131314", bg = "#bcc8cf", bold = true }
normal_alt  = { fg = "#bcc8cf", bg = "#1f2020" }

select_main = { fg = "#131314", bg = "#c3c7ca", bold = true }
select_alt  = { fg = "#c3c7ca", bg = "#1f2020" }

unset_main  = { fg = "#131314", bg = "#ffb4ab", bold = true }
unset_alt   = { fg = "#ffb4ab", bg = "#1f2020" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#1f2020", bg = "#1f2020" }

# Barra de progreso
progress_label  = { fg = "#e4e2e2", bold = true }
progress_normal = { fg = "#bcc8cf", bg = "#0e0e0f" }
progress_error  = { fg = "#ffb4ab", bg = "#0e0e0f" }

# Permisos
perm_sep  = { fg = "#43474a" }
perm_type = { fg = "#bcc8cf" }
perm_read = { fg = "#c3c7ca" }
perm_write= { fg = "#ffb4ab" }
perm_exec = { fg = "#ddc1b5" }

[select]
border   = { fg = "#bcc8cf" }
active   = { fg = "#98a4ab", bg = "#0c181d" }
inactive = { fg = "#e4e2e2" }

[input]
border   = { fg = "#bcc8cf" }
title    = { fg = "#bcc8cf" }
value    = { fg = "#e4e2e2" }
selected = { bg = "#0c181d" }

[completion]
border   = { fg = "#bcc8cf" }
active   = { fg = "#98a4ab", bg = "#0c181d" }
inactive = { fg = "#e4e2e2" }

[tasks]
border  = { fg = "#bcc8cf" }
title   = { fg = "#bcc8cf" }
hover   = { fg = "#98a4ab", bg = "#0c181d" }

[which]
mask            = { bg = "#0e0e0f" }
cand            = { fg = "#bcc8cf" }
rest            = { fg = "#c3c7ca" }
desc            = { fg = "#c3c7ca" }
separator       = "  "
separator_style = { fg = "#43474a" }

[help]
on      = { fg = "#bcc8cf" }
exec    = { fg = "#c3c7ca" }
desc    = { fg = "#e4e2e2" }
hover   = { fg = "#98a4ab", bg = "#0c181d" }
footer  = { fg = "#c3c7ca", bg = "#1f2020" }

[filetype]
rules = [
	{ url = "*/", fg = "#bcc8cf", bold = true },
	{ mime = "image/*", fg = "#ddc1b5" },
	{ mime = "video/*", fg = "#c3c7ca" },
	{ mime = "audio/*", fg = "#c3c7ca" },
	{ mime = "application/x-tar", fg = "#ffb4ab" },
	{ mime = "application/x-bzip*", fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/zip", fg = "#ffb4ab" },
	{ mime = "application/x-rar", fg = "#ffb4ab" },
	{ url = "*", is = "exec", fg = "#c3c7ca" },
	{ url = "*", is = "link", fg = "#ddc1b5" },
	{ url = "*", is = "orphan", fg = "#ffb4ab" },
	{ mime = "*", fg = "#e4e2e2" }
]