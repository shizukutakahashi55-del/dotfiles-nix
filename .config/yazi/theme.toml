# Auto-generado por Matugen — Plantilla para Yazi

[manager]
cwd = { fg = "#ffb3ac" }

# Selección y elementos sobrevolados
hovered         = { fg = "#000000", bg = "#ff544e" }
preview_hovered = { bg = "#2d1b19" }

# Búsqueda / Find
find_keyword  = { fg = "#000000", bg = "#369bbf", bold = true }
find_position = { fg = "#75d2f8", bg = "reset", bold = true }

# Marcadores de archivos
marker_copied   = { fg = "#ffb3ac", bg = "#87201e" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#ffb3ac", bg = "#ff544e" }
marker_selected = { fg = "#75d2f8", bg = "#369bbf" }

# Pestañas
tab_active   = { fg = "#000000", bg = "#ff544e", bold = true }
tab_inactive = { fg = "#e6bdb9", bg = "#2d1b19" }

# Bordes (Corregido)
border_symbol = "│"
border_style  = { fg = "#5c3f3d" }

[mode]
normal_main = { fg = "#1f0f0e", bg = "#ffb3ac", bold = true }
normal_alt  = { fg = "#ffb3ac", bg = "#2d1b19" }

select_main = { fg = "#1f0f0e", bg = "#ffb3ac", bold = true }
select_alt  = { fg = "#ffb3ac", bg = "#2d1b19" }

unset_main  = { fg = "#1f0f0e", bg = "#ffb4ab", bold = true }
unset_alt   = { fg = "#ffb4ab", bg = "#2d1b19" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#2d1b19", bg = "#2d1b19" }

# Barra de progreso
progress_label  = { fg = "#fcdbd8", bold = true }
progress_normal = { fg = "#ffb3ac", bg = "#190a09" }
progress_error  = { fg = "#ffb4ab", bg = "#190a09" }

# Permisos
perm_sep  = { fg = "#5c3f3d" }
perm_type = { fg = "#ffb3ac" }
perm_read = { fg = "#ffb3ac" }
perm_write= { fg = "#ffb4ab" }
perm_exec = { fg = "#75d2f8" }

[select]
border   = { fg = "#ffb3ac" }
active   = { fg = "#000000", bg = "#ff544e" }
inactive = { fg = "#fcdbd8" }

[input]
border   = { fg = "#ffb3ac" }
title    = { fg = "#ffb3ac" }
value    = { fg = "#fcdbd8" }
selected = { bg = "#ff544e" }

[completion]
border   = { fg = "#ffb3ac" }
active   = { fg = "#000000", bg = "#ff544e" }
inactive = { fg = "#fcdbd8" }

[tasks]
border  = { fg = "#ffb3ac" }
title   = { fg = "#ffb3ac" }
hover   = { fg = "#000000", bg = "#ff544e" }

[which]
mask            = { bg = "#190a09" }
cand            = { fg = "#ffb3ac" }
rest            = { fg = "#e6bdb9" }
desc            = { fg = "#ffb3ac" }
separator       = "  "
separator_style = { fg = "#5c3f3d" }

[help]
on      = { fg = "#ffb3ac" }
exec    = { fg = "#ffb3ac" }
desc    = { fg = "#fcdbd8" }
hover   = { fg = "#000000", bg = "#ff544e" }
footer  = { fg = "#e6bdb9", bg = "#2d1b19" }

[filetype]
rules = [
	{ url = "*/", fg = "#ffb3ac", bold = true },
	{ mime = "image/*", fg = "#75d2f8" },
	{ mime = "video/*", fg = "#ffb3ac" },
	{ mime = "audio/*", fg = "#ffb3ac" },
	{ mime = "application/x-tar", fg = "#ffb4ab" },
	{ mime = "application/x-bzip*", fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/zip", fg = "#ffb4ab" },
	{ mime = "application/x-rar", fg = "#ffb4ab" },
	{ url = "*", is = "exec", fg = "#ffb3ac" },
	{ url = "*", is = "link", fg = "#75d2f8" },
	{ url = "*", is = "orphan", fg = "#ffb4ab" },
	{ mime = "*", fg = "#fcdbd8" }
]