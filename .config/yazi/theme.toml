# Auto-generado por Matugen — Plantilla para Yazi

[manager]
cwd = { fg = "#deb8f6" }

# Selección y elementos sobrevolados
hovered         = { fg = "#eac7ff", bg = "#503266" }
preview_hovered = { bg = "#221f22" }

# Búsqueda / Find
find_keyword  = { fg = "#ffc4d5", bg = "#662b42", bold = true }
find_position = { fg = "#ffb0ca", bg = "reset", bold = true }

# Marcadores de archivos
marker_copied   = { fg = "#d3c0db", bg = "#52445a" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#deb8f6", bg = "#503266" }
marker_selected = { fg = "#ffb0ca", bg = "#662b42" }

# Pestañas
tab_active   = { fg = "#eac7ff", bg = "#503266", bold = true }
tab_inactive = { fg = "#cdc3cf", bg = "#221f22" }

# Bordes (Corregido)
border_symbol = "│"
border_style  = { fg = "#4b444e" }

[mode]
normal_main = { fg = "#151216", bg = "#deb8f6", bold = true }
normal_alt  = { fg = "#deb8f6", bg = "#221f22" }

select_main = { fg = "#151216", bg = "#d3c0db", bold = true }
select_alt  = { fg = "#d3c0db", bg = "#221f22" }

unset_main  = { fg = "#151216", bg = "#ffb4ab", bold = true }
unset_alt   = { fg = "#ffb4ab", bg = "#221f22" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#221f22", bg = "#221f22" }

# Barra de progreso
progress_label  = { fg = "#e8e0e6", bold = true }
progress_normal = { fg = "#deb8f6", bg = "#100d11" }
progress_error  = { fg = "#ffb4ab", bg = "#100d11" }

# Permisos
perm_sep  = { fg = "#4b444e" }
perm_type = { fg = "#deb8f6" }
perm_read = { fg = "#d3c0db" }
perm_write= { fg = "#ffb4ab" }
perm_exec = { fg = "#ffb0ca" }

[select]
border   = { fg = "#deb8f6" }
active   = { fg = "#eac7ff", bg = "#503266" }
inactive = { fg = "#e8e0e6" }

[input]
border   = { fg = "#deb8f6" }
title    = { fg = "#deb8f6" }
value    = { fg = "#e8e0e6" }
selected = { bg = "#503266" }

[completion]
border   = { fg = "#deb8f6" }
active   = { fg = "#eac7ff", bg = "#503266" }
inactive = { fg = "#e8e0e6" }

[tasks]
border  = { fg = "#deb8f6" }
title   = { fg = "#deb8f6" }
hover   = { fg = "#eac7ff", bg = "#503266" }

[which]
mask            = { bg = "#100d11" }
cand            = { fg = "#deb8f6" }
rest            = { fg = "#cdc3cf" }
desc            = { fg = "#d3c0db" }
separator       = "  "
separator_style = { fg = "#4b444e" }

[help]
on      = { fg = "#deb8f6" }
exec    = { fg = "#d3c0db" }
desc    = { fg = "#e8e0e6" }
hover   = { fg = "#eac7ff", bg = "#503266" }
footer  = { fg = "#cdc3cf", bg = "#221f22" }

[filetype]
rules = [
	{ url = "*/", fg = "#deb8f6", bold = true },
	{ mime = "image/*", fg = "#ffb0ca" },
	{ mime = "video/*", fg = "#d3c0db" },
	{ mime = "audio/*", fg = "#d3c0db" },
	{ mime = "application/x-tar", fg = "#ffb4ab" },
	{ mime = "application/x-bzip*", fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/zip", fg = "#ffb4ab" },
	{ mime = "application/x-rar", fg = "#ffb4ab" },
	{ url = "*", is = "exec", fg = "#d3c0db" },
	{ url = "*", is = "link", fg = "#ffb0ca" },
	{ url = "*", is = "orphan", fg = "#ffb4ab" },
	{ mime = "*", fg = "#e8e0e6" }
]