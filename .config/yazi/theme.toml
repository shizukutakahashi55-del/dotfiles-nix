# Auto-generado por Matugen — Plantilla para Yazi

[manager]
cwd = { fg = "#00ddd4" }

# Selección y elementos sobrevolados
hovered         = { fg = "#00fcf2", bg = "#00504c" }
preview_hovered = { bg = "#152221" }

# Búsqueda / Find
find_keyword  = { fg = "#bbe9ff", bg = "#004d63", bold = true }
find_position = { fg = "#94cfe9", bg = "reset", bold = true }

# Marcadores de archivos
marker_copied   = { fg = "#a1ced6", bg = "#1f4d54" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#00ddd4", bg = "#00504c" }
marker_selected = { fg = "#94cfe9", bg = "#004d63" }

# Pestañas
tab_active   = { fg = "#00fcf2", bg = "#00504c", bold = true }
tab_inactive = { fg = "#bbc9c7", bg = "#152221" }

# Bordes (Corregido)
border_symbol = "│"
border_style  = { fg = "#3c4948" }

[mode]
normal_main = { fg = "#091615", bg = "#00ddd4", bold = true }
normal_alt  = { fg = "#00ddd4", bg = "#152221" }

select_main = { fg = "#091615", bg = "#a1ced6", bold = true }
select_alt  = { fg = "#a1ced6", bg = "#152221" }

unset_main  = { fg = "#091615", bg = "#ffb4ab", bold = true }
unset_alt   = { fg = "#ffb4ab", bg = "#152221" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#152221", bg = "#152221" }

# Barra de progreso
progress_label  = { fg = "#d7e5e3", bold = true }
progress_normal = { fg = "#00ddd4", bg = "#04100f" }
progress_error  = { fg = "#ffb4ab", bg = "#04100f" }

# Permisos
perm_sep  = { fg = "#3c4948" }
perm_type = { fg = "#00ddd4" }
perm_read = { fg = "#a1ced6" }
perm_write= { fg = "#ffb4ab" }
perm_exec = { fg = "#94cfe9" }

[select]
border   = { fg = "#00ddd4" }
active   = { fg = "#00fcf2", bg = "#00504c" }
inactive = { fg = "#d7e5e3" }

[input]
border   = { fg = "#00ddd4" }
title    = { fg = "#00ddd4" }
value    = { fg = "#d7e5e3" }
selected = { bg = "#00504c" }

[completion]
border   = { fg = "#00ddd4" }
active   = { fg = "#00fcf2", bg = "#00504c" }
inactive = { fg = "#d7e5e3" }

[tasks]
border  = { fg = "#00ddd4" }
title   = { fg = "#00ddd4" }
hover   = { fg = "#00fcf2", bg = "#00504c" }

[which]
mask            = { bg = "#04100f" }
cand            = { fg = "#00ddd4" }
rest            = { fg = "#bbc9c7" }
desc            = { fg = "#a1ced6" }
separator       = "  "
separator_style = { fg = "#3c4948" }

[help]
on      = { fg = "#00ddd4" }
exec    = { fg = "#a1ced6" }
desc    = { fg = "#d7e5e3" }
hover   = { fg = "#00fcf2", bg = "#00504c" }
footer  = { fg = "#bbc9c7", bg = "#152221" }

[filetype]
rules = [
	{ url = "*/", fg = "#00ddd4", bold = true },
	{ mime = "image/*", fg = "#94cfe9" },
	{ mime = "video/*", fg = "#a1ced6" },
	{ mime = "audio/*", fg = "#a1ced6" },
	{ mime = "application/x-tar", fg = "#ffb4ab" },
	{ mime = "application/x-bzip*", fg = "#ffb4ab" },
	{ mime = "application/x-7z-compressed", fg = "#ffb4ab" },
	{ mime = "application/zip", fg = "#ffb4ab" },
	{ mime = "application/x-rar", fg = "#ffb4ab" },
	{ url = "*", is = "exec", fg = "#a1ced6" },
	{ url = "*", is = "link", fg = "#94cfe9" },
	{ url = "*", is = "orphan", fg = "#ffb4ab" },
	{ mime = "*", fg = "#d7e5e3" }
]