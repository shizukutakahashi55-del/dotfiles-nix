# ============================================================
#  Kitty — Cozy Coffee & Soft Pastel ☕🌸✨
# ============================================================


# ── Ventana ───────────────────────────────────────────────────

background_opacity 0.8
background_blur 1

hide_window_decorations no

window_padding_width 12
window_margin_width 0

confirm_os_window_close 0


# ── Fuente ────────────────────────────────────────────────────

font_size 11.0

font_family      JetBrainsMono Nerd Font Regular
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic


# ── Cursor ────────────────────────────────────────────────────

cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5

cursor #f5c2e7
cursor_text_color #1e1e2e


# ── Fondo / Texto ─────────────────────────────────────────────

# Fondo café/marrón oscuro cálido + texto crema pastel
foreground #f5e6d3
background #1f1a1c

selection_foreground #1f1a1c
selection_background #f5c2e7

url_color #f9e2af
url_style curly


# ── Colores normales ──────────────────────────────────────────

# Negro (Muted Dark Pink/Brown)
color0 #382d33

# Rojo (Rosa Fresa Cálido)
color1 #e78a8a

# Verde (Menta Pastel)
color2 #a6e3a1

# Amarillo (Durazno Suave)
color3 #f9e2af

# Azul (Lavanda Dulce)
color4 #cba6f7

# Magenta (Rosa Sakura)
color5 #f5c2e7

# Cyan (Aqua Menta)
color6 #94e2d5

# Blanco (Crema)
color7 #f5e6d3


# ── Colores brillantes ────────────────────────────────────────

# Negro brillante
color8 #52434b

# Rojo brillante
color9 #f38ba8

# Verde brillante
color10 #b4befe

# Amarillo brillante
color11 #fae3b0

# Azul brillante
color12 #cba6f7

# Magenta brillante
color13 #f4b8e4

# Cyan brillante
color14 #a6e3a1

# Blanco brillante
color15 #ffffff


# ── Tab Bar Cozy ──────────────────────────────────────────────

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #1f1a1c
active_tab_background   #f5c2e7
active_tab_font_style   bold
inactive_tab_foreground #f5e6d3
inactive_tab_background #2d2429


# ── Shell ─────────────────────────────────────────────────────

shell zsh
