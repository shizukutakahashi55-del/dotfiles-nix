# ============================================================
#  Kitty — Cozy Coffee & Soft Pastel ☕🌸✨
# ============================================================

# ── Ventana ───────────────────────────────────────────────────
background_opacity 0.7
background_blur 1
hide_window_decorations no
window_padding_width 12
window_margin_width 0
confirm_os_window_close 0

# ── Control Remoto ───────────────────────────────────────────
allow_remote_control yes
listen_on unix:@mykitty

# ── Fuente ────────────────────────────────────────────────────
font_size 11.0
font_family      JetBrainsMono Nerd Font Regular
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

# ── Cursor ────────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor #f5c2e7
cursor_text_color #1e1e2e

# ── Fondo / Texto ─────────────────────────────────────────────
foreground #f5e6d3
background #1f1a1c
selection_foreground #1f1a1c
selection_background #f5c2e7
url_color #f9e2af
url_style curly

# ── Colores normales ──────────────────────────────────────────
color0 #382d33
color1 #e78a8a
color2 #a6e3a1
color3 #f9e2af
color4 #cba6f7
color5 #f5c2e7
color6 #94e2d5
color7 #f5e6d3

# ── Colores brillantes ────────────────────────────────────────
color8 #52434b
color9 #f38ba8
color10 #b4befe
color11 #fae3b0
color12 #cba6f7
color13 #f4b8e4
color14 #a6e3a1
color15 #ffffff

# ── Tab Bar Cozy ──────────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #1f1a1c
active_tab_background   #f5c2e7
active_tab_font_style   bold
inactive_tab_foreground #f5e6d3
inactive_tab_background #2d2429

# ── Shell ─────────────────────────────────────────────────────
shell zsh