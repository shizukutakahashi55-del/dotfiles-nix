<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ~/.config/fontconfig/conf.d/99-oozeshell-pixel.conf
     Si una fuente pixel no trae un glifo (íconos Nerd Font), usa los símbolos de Nerd Font. -->
<fontconfig>
  <alias binding="weak"><family>Pixelify Sans</family><accept><family>Symbols Nerd Font Mono</family><family>JetBrainsMono Nerd Font</family></accept></alias>
  <alias binding="weak"><family>Jersey 10</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>Silkscreen</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>VT323</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>Press Start 2P</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <!-- Fuente de texto de OozeSoft: los glifos que no traiga salen de la Nerd Font -->
  <alias binding="weak"><family>Nunito</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>Outfit</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>Lexend</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>Plus Jakarta Sans</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>Manrope</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>DM Sans</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>Quicksand</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>Figtree</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
  <alias binding="weak"><family>Inter</family><accept><family>Symbols Nerd Font Mono</family></accept></alias>
</fontconfig>
