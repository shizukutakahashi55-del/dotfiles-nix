# ============================================================================
# HYPRIDLE - NIRI ADAPTATION
# ============================================================================
#
# hypridle is not tied to Hyprland for the commands used here. The only
# Hyprland-specific parts of the original file were hyprctl dispatch calls.
# Those are replaced with Niri's IPC actions.
#
# The lock screen is still handled by OozeShell.
# ============================================================================

general {
    lock_cmd = quickshell ipc -p ~/.config/quickshell/OozeShell/shell.qml call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
}

# Lock after 15 minutes, matching the original 900 second timeout.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Turn monitors off after 20 minutes, matching the original 1200 seconds.
# Niri exposes power-off-monitors/power-on-monitors directly through IPC.
listener {
    timeout = 1200
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# Suspend after 30 minutes was commented in the original config, so it
# remains disabled here.
#
