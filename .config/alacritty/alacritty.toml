# ============================================================
# Alacritty — Cozy Coffee & Soft Pastel ☕🌸✨
# ============================================================

[general]
live_config_reload = true

import = [
    "~/.config/alacritty/colors.toml"
]

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
decorations = "full"
blur = true
opacity = 0.88

[terminal.shell]
program = "zsh"

# ── Fuente ──────────────────────────────────────────────────

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# ── Cursor ──────────────────────────────────────────────────

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
