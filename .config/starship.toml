# ~/.config/matugen/templates/starship.toml
# Starship + Matugen
# Unicode nativo — sin Nerd Fonts ni emojis dependientes de la fuente

format = """
[█](fg:#00ddd4)\
$username\
[█](bg:#a1ced6 fg:#00ddd4)\
$hostname\
[█](bg:#94cfe9 fg:#a1ced6)\
$directory\
[█](fg:#94cfe9 bg:#00504c)\
$git_branch\
$git_status\
[█](fg:#00504c)\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true


# ─────────────────────────────────────────────
# Usuario
# ─────────────────────────────────────────────

[username]
show_always = true

style_user = "bg:#00ddd4 fg:#003734 bold"
style_root = "bg:#ffb4ab fg:#690005 bold"

format = "[✦ $user]($style)"


# ─────────────────────────────────────────────
# Hostname
# ─────────────────────────────────────────────

[hostname]
ssh_only = false

style = "bg:#a1ced6 fg:#00363d bold"

format = "[@$hostname]($style)"


# ─────────────────────────────────────────────
# Directorio
# ─────────────────────────────────────────────

[directory]
style = "bg:#94cfe9 fg:#003545 bold"

format = "[ ◈ $path ]($style)"

truncation_length = 3
truncation_symbol = "…/"


[directory.substitutions]
"Documents" = "▣"
"Downloads" = "⇩"
"Music" = "♫"
"Pictures" = "▧"
"Videos" = "▶"
"Projects" = "⌘"


# ─────────────────────────────────────────────
# Git branch
# ─────────────────────────────────────────────

[git_branch]
symbol = "⎇ "

style = "bg:#00504c fg:#00fcf2 bold"

format = "[ $symbol$branch]($style)"


# ─────────────────────────────────────────────
# Git status
# ─────────────────────────────────────────────

[git_status]
style = "bg:#00504c fg:#00fcf2 bold"

format = "[($all_status$ahead_behind)]($style)"

conflicted = "✖ "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕${ahead_count}↓${behind_count} "
untracked = "… "
modified = "● "
staged = "✓ "
renamed = "» "
deleted = "− "


# ─────────────────────────────────────────────
# Duración del comando
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 2_000

style = "bold #94cfe9"

format = " ⏱ [$duration]($style)"


# ─────────────────────────────────────────────
# Hora
# ─────────────────────────────────────────────

[time]
disabled = false

style = "bold #00ddd4"

format = " ⯈ [$time]($style)"

time_format = "%H:%M"


# ─────────────────────────────────────────────
# Prompt
# ─────────────────────────────────────────────

[character]
success_symbol = "[╭─ ⮞](bold #00ddd4) "
error_symbol = "[╭─ ⮞](bold #ffb4ab) "
