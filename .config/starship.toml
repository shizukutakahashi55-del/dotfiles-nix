# Plantilla corregida para Matugen (~/.config/matugen/templates/starship.toml)

format = """
[](fg:#ffafd1)\
$username\
[](bg:#ffb0d1 fg:#ffafd1)\
$hostname\
[](bg:#ffb694 fg:#ffb0d1)\
$directory\
[](fg:#ffb694 bg:#792952)\
$git_branch\
$git_status\
[](fg:#792952)\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[username]
show_always = true
style_user = "bg:#ffafd1 fg:#5c113b bold"
style_root = "bg:#ffb4ab fg:#690005 bold"
format = "[󱄅 $user]($style)"

[hostname]
ssh_only = false
style = "bg:#ffb0d1 fg:#531d38 bold"
format = "[@$hostname]($style)"

[directory]
style = "bg:#ffb694 fg:#542105 bold"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "󰊢 "
style = "bg:#792952 fg:#ffd8e6 bold"
format = "[ $symbol$branch]($style)"

[git_status]
style = "bg:#792952 fg:#ffd8e6 bold"
format = "[($all_status$ahead_behind)]($style) "
conflicted = "⚔ "
ahead = "⇡${count} "
behind = "⇣${count} "
untracked = "󰞋 "
modified = "󰏫 "
staged = "󰸞 "

[cmd_duration]
min_time = 2_000
style = "bold #ffb694"
format = " 󱦟 [$duration]($style)"

[time]
disabled = false
style = "bold #ffafd1"
format = "󰥔 [$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[╭─ 󰅂](bold #ffafd1) "
error_symbol = "[╭─ 󰅂](bold #ffb4ab) "