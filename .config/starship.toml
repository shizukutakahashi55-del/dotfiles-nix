# ~/.config/matugen/templates/starship.toml
# Starship + Matugen
# Unicode nativo — sin Nerd Fonts ni emojis dependientes de la fuente

format = """
[█](fg:#90d889)\
$username\
[█](bg:#baccb3 fg:#90d889)\
$hostname\
[█](bg:#a0cfd4 fg:#baccb3)\
$directory\
[█](fg:#a0cfd4 bg:#075315)\
$git_branch\
$git_status\
[█](fg:#075315)\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true


# ─────────────────────────────────────────────
# Usuario
# ─────────────────────────────────────────────

[username]
show_always = true

style_user = "bg:#90d889 fg:#00390a bold"
style_root = "bg:#ffb4ab fg:#690005 bold"

format = "[✦ $user]($style)"


# ─────────────────────────────────────────────
# Hostname
# ─────────────────────────────────────────────

[hostname]
ssh_only = false

style = "bg:#baccb3 fg:#253423 bold"

format = "[@$hostname]($style)"


# ─────────────────────────────────────────────
# Directorio
# ─────────────────────────────────────────────

[directory]
style = "bg:#a0cfd4 fg:#00363b bold"

format = "[ ◈ $path ]($style)"

truncation_length = 3
truncation_symbol = "…/"


[directory.substitutions]
"Documents" = "▣"
"Downloads" = "⇩"
"Music" = "♫"
"Pictures" = "▧"
"Videos" = "▶"
"Projects" = "⌘"


# ─────────────────────────────────────────────
# Git branch
# ─────────────────────────────────────────────

[git_branch]
symbol = "⎇ "

style = "bg:#075315 fg:#abf5a3 bold"

format = "[ $symbol$branch]($style)"


# ─────────────────────────────────────────────
# Git status
# ─────────────────────────────────────────────

[git_status]
style = "bg:#075315 fg:#abf5a3 bold"

format = "[($all_status$ahead_behind)]($style)"

conflicted = "✖ "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕${ahead_count}↓${behind_count} "
untracked = "… "
modified = "● "
staged = "✓ "
renamed = "» "
deleted = "− "


# ─────────────────────────────────────────────
# Duración del comando
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 2_000

style = "bold #a0cfd4"

format = " ⏱ [$duration]($style)"


# ─────────────────────────────────────────────
# Hora
# ─────────────────────────────────────────────

[time]
disabled = false

style = "bold #90d889"

format = " ⯈ [$time]($style)"

time_format = "%H:%M"


# ─────────────────────────────────────────────
# Prompt
# ─────────────────────────────────────────────

[character]
success_symbol = "[╭─ ⮞](bold #90d889) "
error_symbol = "[╭─ ⮞](bold #ffb4ab) "
