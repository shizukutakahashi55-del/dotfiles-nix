# ~/.config/matugen/templates/starship.toml
# Starship + Matugen

format = """
[](fg:#87ceff)\
$username\
[](bg:#b3c8e9 fg:#87ceff)\
$hostname\
[](bg:#b8c4fa fg:#b3c8e9)\
$directory\
[](fg:#b8c4fa)\
$git_branch\
$git_status\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true


# ─────────────────────────────────────────────
# Usuario
# ─────────────────────────────────────────────

[username]
show_always = true

style_user = "bg:#87ceff fg:#00344d bold"
style_root = "bg:#ffb4ab fg:#690005 bold"

format = "[✦ $user]($style)"


# ─────────────────────────────────────────────
# Hostname
# ─────────────────────────────────────────────

[hostname]
ssh_only = false

style = "bg:#b3c8e9 fg:#1d314b bold"

format = "[@$hostname]($style)"


# ─────────────────────────────────────────────
# Directorio
# ─────────────────────────────────────────────

[directory]
style = "bg:#b8c4fa fg:#212e5a bold"

format = "[ ◈ $path ]($style)"

truncation_length = 3
truncation_symbol = "…/"


[directory.substitutions]
"Documents" = "▣"
"Downloads" = "⇩"
"Music" = "♫"
"Pictures" = "▧"
"Videos" = "▶"
"Projects" = "⌘"


# ─────────────────────────────────────────────
# Git branch
# ─────────────────────────────────────────────

[git_branch]
symbol = "⎇ "

style = "bg:#004c6d fg:#c8e6ff bold"

format = "[](fg:#004c6d)[ $symbol$branch ]($style)[](fg:#004c6d)"


# ─────────────────────────────────────────────
# Git status
# ─────────────────────────────────────────────

[git_status]
style = "bold #87ceff"

format = "[( $all_status$ahead_behind)]($style)"

conflicted = "✖ "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕${ahead_count}↓${behind_count} "
untracked = "… "
modified = "● "
staged = "✓ "
renamed = "» "
deleted = "− "


# ─────────────────────────────────────────────
# Duración del comando
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 2_000

style = "bold #b8c4fa"

format = " ⏱ [$duration]($style)"
disabled = false


# ─────────────────────────────────────────────
# Hora
# ─────────────────────────────────────────────

[time]
disabled = false

style = "bold #87ceff"

format = " ⯈ [$time]($style)"

time_format = "%I:%M %p"


# ─────────────────────────────────────────────
# Prompt
# ─────────────────────────────────────────────

[character]
success_symbol = "[╭─ ⮞](bold #87ceff) "
error_symbol = "[╭─ ⮞](bold #ffb4ab) "
