# ~/.config/matugen/templates/starship.toml
# Starship + Matugen
# Unicode nativo — sin Nerd Fonts ni emojis dependientes de la fuente

format = """
[█](fg:#ffb3ac)\
$username\
[█](bg:#ffb3ac fg:#ffb3ac)\
$hostname\
[█](bg:#75d2f8 fg:#ffb3ac)\
$directory\
[█](fg:#75d2f8 bg:#ff544e)\
$git_branch\
$git_status\
[█](fg:#ff544e)\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true


# ─────────────────────────────────────────────
# Usuario
# ─────────────────────────────────────────────

[username]
show_always = true

style_user = "bg:#ffb3ac fg:#680008 bold"
style_root = "bg:#ffb4ab fg:#690005 bold"

format = "[✦ $user]($style)"


# ─────────────────────────────────────────────
# Hostname
# ─────────────────────────────────────────────

[hostname]
ssh_only = false

style = "bg:#ffb3ac fg:#66050b bold"

format = "[@$hostname]($style)"


# ─────────────────────────────────────────────
# Directorio
# ─────────────────────────────────────────────

[directory]
style = "bg:#75d2f8 fg:#003545 bold"

format = "[ ◈ $path ]($style)"

truncation_length = 3
truncation_symbol = "…/"


[directory.substitutions]
"Documents" = "▣"
"Downloads" = "⇩"
"Music" = "♫"
"Pictures" = "▧"
"Videos" = "▶"
"Projects" = "⌘"


# ─────────────────────────────────────────────
# Git branch
# ─────────────────────────────────────────────

[git_branch]
symbol = "⎇ "

style = "bg:#ff544e fg:#000000 bold"

format = "[ $symbol$branch]($style)"


# ─────────────────────────────────────────────
# Git status
# ─────────────────────────────────────────────

[git_status]
style = "bg:#ff544e fg:#000000 bold"

format = "[($all_status$ahead_behind)]($style)"

conflicted = "✖ "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕${ahead_count}↓${behind_count} "
untracked = "… "
modified = "● "
staged = "✓ "
renamed = "» "
deleted = "− "


# ─────────────────────────────────────────────
# Duración del comando
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 2_000

style = "bold #75d2f8"

format = " ⏱ [$duration]($style)"


# ─────────────────────────────────────────────
# Hora
# ─────────────────────────────────────────────

[time]
disabled = false

style = "bold #ffb3ac"

format = " ⯈ [$time]($style)"

time_format = "%H:%M"


# ─────────────────────────────────────────────
# Prompt
# ─────────────────────────────────────────────

[character]
success_symbol = "[╭─ ⮞](bold #ffb3ac) "
error_symbol = "[╭─ ⮞](bold #ffb4ab) "
