# ~/.config/matugen/templates/starship.toml
# Starship + Matugen
# Unicode nativo — sin Nerd Fonts ni emojis dependientes de la fuente

format = """
[█](fg:#e2b6ff)\
$username\
[█](bg:#d2c1d9 fg:#e2b6ff)\
$hostname\
[█](bg:#f4b7ba fg:#d2c1d9)\
$directory\
[█](fg:#f4b7ba bg:#5f3280)\
$git_branch\
$git_status\
[█](fg:#5f3280)\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true


# ─────────────────────────────────────────────
# Usuario
# ─────────────────────────────────────────────

[username]
show_always = true

style_user = "bg:#e2b6ff fg:#471868 bold"
style_root = "bg:#ffb4ab fg:#690005 bold"

format = "[✦ $user]($style)"


# ─────────────────────────────────────────────
# Hostname
# ─────────────────────────────────────────────

[hostname]
ssh_only = false

style = "bg:#d2c1d9 fg:#372c3f bold"

format = "[@$hostname]($style)"


# ─────────────────────────────────────────────
# Directorio
# ─────────────────────────────────────────────

[directory]
style = "bg:#f4b7ba fg:#4c2528 bold"

format = "[ ◈ $path ]($style)"

truncation_length = 3
truncation_symbol = "…/"


[directory.substitutions]
"Documents" = "▣"
"Downloads" = "⇩"
"Music" = "♫"
"Pictures" = "▧"
"Videos" = "▶"
"Projects" = "⌘"


# ─────────────────────────────────────────────
# Git branch
# ─────────────────────────────────────────────

[git_branch]
symbol = "⎇ "

style = "bg:#5f3280 fg:#f3daff bold"

format = "[ $symbol$branch]($style)"


# ─────────────────────────────────────────────
# Git status
# ─────────────────────────────────────────────

[git_status]
style = "bg:#5f3280 fg:#f3daff bold"

format = "[($all_status$ahead_behind)]($style)"

conflicted = "✖ "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕${ahead_count}↓${behind_count} "
untracked = "… "
modified = "● "
staged = "✓ "
renamed = "» "
deleted = "− "


# ─────────────────────────────────────────────
# Duración del comando
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 2_000

style = "bold #f4b7ba"

format = " ⏱ [$duration]($style)"


# ─────────────────────────────────────────────
# Hora
# ─────────────────────────────────────────────

[time]
disabled = false

style = "bold #e2b6ff"

format = " ⯈ [$time]($style)"

time_format = "%H:%M"


# ─────────────────────────────────────────────
# Prompt
# ─────────────────────────────────────────────

[character]
success_symbol = "[╭─ ⮞](bold #e2b6ff) "
error_symbol = "[╭─ ⮞](bold #ffb4ab) "
