# ~/.config/matugen/templates/starship.toml
# Starship + Matugen
# Unicode nativo — sin Nerd Fonts ni emojis dependientes de la fuente

format = """
[█](fg:#5cdbbd)\
$username\
[█](bg:#b1ccc3 fg:#5cdbbd)\
$hostname\
[█](bg:#a9cbe3 fg:#b1ccc3)\
$directory\
[█](fg:#a9cbe3 bg:#005142)\
$git_branch\
$git_status\
[█](fg:#005142)\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true


# ─────────────────────────────────────────────
# Usuario
# ─────────────────────────────────────────────

[username]
show_always = true

style_user = "bg:#5cdbbd fg:#00382d bold"
style_root = "bg:#ffb4ab fg:#690005 bold"

format = "[✦ $user]($style)"


# ─────────────────────────────────────────────
# Hostname
# ─────────────────────────────────────────────

[hostname]
ssh_only = false

style = "bg:#b1ccc3 fg:#1d352e bold"

format = "[@$hostname]($style)"


# ─────────────────────────────────────────────
# Directorio
# ─────────────────────────────────────────────

[directory]
style = "bg:#a9cbe3 fg:#0f3447 bold"

format = "[ ◈ $path ]($style)"

truncation_length = 3
truncation_symbol = "…/"


[directory.substitutions]
"Documents" = "▣"
"Downloads" = "⇩"
"Music" = "♫"
"Pictures" = "▧"
"Videos" = "▶"
"Projects" = "⌘"


# ─────────────────────────────────────────────
# Git branch
# ─────────────────────────────────────────────

[git_branch]
symbol = "⎇ "

style = "bg:#005142 fg:#7bf8d9 bold"

format = "[ $symbol$branch]($style)"


# ─────────────────────────────────────────────
# Git status
# ─────────────────────────────────────────────

[git_status]
style = "bg:#005142 fg:#7bf8d9 bold"

format = "[($all_status$ahead_behind)]($style)"

conflicted = "✖ "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕${ahead_count}↓${behind_count} "
untracked = "… "
modified = "● "
staged = "✓ "
renamed = "» "
deleted = "− "


# ─────────────────────────────────────────────
# Duración del comando
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 2_000

style = "bold #a9cbe3"

format = " ⏱ [$duration]($style)"


# ─────────────────────────────────────────────
# Hora
# ─────────────────────────────────────────────

[time]
disabled = false

style = "bold #5cdbbd"

format = " ⯈ [$time]($style)"

time_format = "%H:%M"


# ─────────────────────────────────────────────
# Prompt
# ─────────────────────────────────────────────

[character]
success_symbol = "[╭─ ⮞](bold #5cdbbd) "
error_symbol = "[╭─ ⮞](bold #ffb4ab) "
