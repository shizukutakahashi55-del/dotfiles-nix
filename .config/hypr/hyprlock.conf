# ~/.config/hypr/hyprlock.conf

# Importar colores dinámicos de Matugen
source = $HOME/.config/hypr/colors.conf

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Reloj
label {
    monitor =
    text = $TIME
    color = $primary
    font_size = 90
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# Saludo / Mensaje
label {
    monitor =
    text = 󰌾  Welcome back $USER
    color = $secondary
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# Campo de entrada de contraseña
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    
    # Integración de colores Matugen
    outer_color = $primary
    inner_color = $surface_container_highest
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    
    placeholder_text = <i><span foreground="##$on_surface_variant_raw">Enter password...</span></i>    
    hide_input = false
    rounding = 20
    
    position = 0, -50
    halign = center
    valign = center
}