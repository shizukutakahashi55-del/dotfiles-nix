
# ============================================================================
# ~/.config/hypr/hyprlock.conf
# ============================================================================
# Hyprlock — Matugen / Minimal
# ============================================================================

# ----------------------------------------------------------------------------
#  Matugen Colors
# ----------------------------------------------------------------------------

source = $HOME/.config/hypr/colors.conf


# ============================================================================
# BACKGROUND
# ============================================================================

background {
    monitor =
    path = $HOME/.config/hypr/Backgrounds/1409615.png
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

animations {
    enabled = true
    animation = inputFieldDots, 1, 2, linear
}

# ============================================================================
# SALUDO
# ============================================================================

label {
    monitor =
    text = 󰌾  Welcome back, $USER
    color = $secondary
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}


# ============================================================================
# RELOJ
# ============================================================================

label {
    monitor =
    text = $TIME
    color = $primary
    font_size = 88
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 145
    halign = center
    valign = center
}


# ============================================================================
# DETALLE DECORATIVO
# ============================================================================

label {
    monitor =
    text = ─────────────
    color = $primary
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = 0, 85
    halign = center
    valign = center
}


# ============================================================================
# CAMPO DE CONTRASEÑA
# ============================================================================

input-field {
    monitor =
    size = 280, 54
    outline_thickness = 2
    dots_size = 0.4
    dots_spacing = 0.05
    dots_center = true
    dots_rounding = -1
    dots_text_format = ❄
    fade_on_empty = false
    #hide_input = false

    # ------------------------------------------------------------------------
    # Colores normales
    # ------------------------------------------------------------------------

    outer_color = $primary
    inner_color = $surface_container_highest
    font_color = $on_surface


    # ------------------------------------------------------------------------
    # Estados
    # ------------------------------------------------------------------------

    check_color = $tertiary
    fail_color = $error

    # Caps Lock
    capslock_color = $tertiary

    # Cambia el color de los puntos cuando Caps Lock está activo
    swap_font_color = true


    # ------------------------------------------------------------------------
    # Placeholder
    # ------------------------------------------------------------------------

    placeholder_text = <i><span foreground="##$on_surface_variant_raw">󰌾  Enter password...</span></i>


    # ------------------------------------------------------------------------
    # Forma
    # ------------------------------------------------------------------------

    rounding = 22


    # ------------------------------------------------------------------------
    # Posición
    # ------------------------------------------------------------------------

    position = 0, -55
    halign = center
    valign = center
}


# ============================================================================
# INFORMACIÓN INFERIOR
# ============================================================================

label {
    monitor =
    text = Hyprland  •  $USER
    color = $on_surface_variant
    font_size = 13
    font_family = JetBrains Mono Nerd Font
    position = 0, 45
    halign = center
    valign = bottom
}