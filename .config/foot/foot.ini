# -*- conf -*-
# ============================================================
# Foot — OozeSoft Config (Zsh + Matugen) ☕🌸✨
# ============================================================

# ── Importación de Colores Dinámicos (Matugen) ───────────────
include=~/.config/foot/foot-colors.ini

# ── General & Shell ───────────────────────────────────────────
shell=zsh
term=foot
app-id=foot
title=foot
locked-title=no

# ── Fuente ────────────────────────────────────────────────────
font=JetBrainsMono Nerd Font:style=Regular:size=12
font-bold=JetBrainsMono Nerd Font:style=Bold:size=12
font-italic=JetBrainsMono Nerd Font:style=Italic:size=12
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=12
line-height=13
letter-spacing=0

# ── Ventana & Padding ─────────────────────────────────────────
pad=12x12 center-when-maximized-and-fullscreen
initial-window-size-pixels=850x550
resize-by-cells=yes
resize-delay-ms=100
bold-text-in-bright=no
word-delimiters=,│`|:"'()[]{}<>

# ── Transparencia y Renderizado ──────────────────────────────
[colors-dark]
alpha=1.0

# ── Cursor ────────────────────────────────────────────────────
[cursor]
style=beam
blink=yes
blink-rate=500
beam-thickness=1.8

# ── Scrollback (Historial) ───────────────────────────────────
[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative

# ── Mouse ─────────────────────────────────────────────────────
[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

# ── Integración con URLs ──────────────────────────────────────
[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
style=curly
osc8-underline=url-mode

# ── Decoraciones de Ventana (CSD) ─────────────────────────────
[csd]
preferred=none
border-width=0

# ── Notificaciones de Escritorio ─────────────────────────────
[desktop-notifications]
inhibit-when-focused=yes

# ── Atajos de Teclado (Key Bindings) ─────────────────────────
[key-bindings]
# Portapapeles y Terminales
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert
spawn-terminal=Control+Shift+n

# Navegación del Historial
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-home=Control+Shift+Home
scrollback-end=Control+Shift+End

# Control de Zoom / Fuente
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

# Búsqueda y Enlaces
search-start=Control+Shift+r
show-urls-launch=Control+Shift+o
pipe-command-output=[wl-copy] Control+Shift+g # Copia la salida del último comando

# ── Búsqueda Interactiva (Ctrl + Shift + R) ───────────────────
[search-bindings]
cancel=Control+g Control+c Escape
commit=Return KP_Enter
find-prev=Control+r
find-next=Control+s
cursor-left=Left
cursor-right=Right
delete-prev=BackSpace
delete-next=Delete

